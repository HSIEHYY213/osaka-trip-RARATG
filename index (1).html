<title>我的旅程小幫手 (Copy)</title>

<style>
:root{--bg:#FFFCF6;--card:#FFFCF6;--tx:#3E3A39;--mu:#6E6866;--ac:#F2A497;--ac2:#A8D3E6;--gold:#F6D27A;--green:#B9DAA5;--bd:#3E3A39;--dg:#3E3A39;color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:96px}
input,select,textarea,button{font:inherit;color:var(--tx)}
.hero{position:relative;min-height:150px;overflow:hidden;background:transparent;border-bottom:3px solid var(--bd);padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 16px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.hero>svg.deco{position:absolute;right:12px;bottom:10px;width:200px;height:58px;pointer-events:none;z-index:0}
#hsvg{position:absolute;inset:0;width:100%;height:100%}
.hero>input,.hero>textarea,.hero>label{position:relative;z-index:1}
.hero input{display:block;border:0;background:transparent;outline:0;padding:0}
.hero input#title{background:transparent;border:0;border-radius:0;padding:0;width:auto;max-width:90%;align-self:flex-start}
.hero input#title{font-size:34px;font-weight:700;line-height:1.3}
.hero textarea#sub{display:block;width:100%;resize:none;border:0;background:transparent;outline:0;padding:0;font:inherit;font-size:20px;line-height:1.5;color:var(--tx)}
.hero input::placeholder{color:var(--mu)}
.cover{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--card);border:3px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;z-index:2}
.cover input{display:none}
.sheet{max-width:640px;margin:0 auto;padding:18px 14px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:14px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
input,select{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:8px 10px;min-width:0;flex:1 1 120px;outline:0}
button{cursor:pointer;border:3px solid var(--bd);border-radius:999px;padding:7px 16px;background:var(--ac);color:var(--tx);font-weight:700}
button.x{background:transparent;border:0;color:var(--tx);padding:2px 8px;font-size:20px;line-height:1}
.chip{background:var(--card);border:3px solid var(--bd);border-radius:999px;padding:6px 16px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px}
.days{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px}
.dt{flex:0 0 66px;background:var(--card);color:var(--tx);border:3px solid var(--bd);border-radius:22px;padding:8px 0;text-align:center}
.dt small{display:block;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.dt b{display:block;font-size:24px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.dt.on{background:var(--gold)}
.wx{display:flex;align-items:center;gap:12px;background:var(--card)}
.wx .ic{font-size:36px;flex:0 0 auto}
.wx input{border:0;background:transparent;padding:2px 0;flex:none;width:100%}
.wx .t{font-size:28px;font-weight:700}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed var(--bd)}
.item:first-child{border-top:0}
.grow{flex:1;min-width:0;word-break:break-word}
.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:12px;background:var(--green);border:2px solid var(--bd);border-radius:999px;padding:0 8px;margin-left:6px}
.big{font-size:28px;font-weight:700}
.bar{height:12px;background:var(--card);border:2px solid var(--bd);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green)}
.over{color:var(--tx);text-decoration:underline wavy var(--ac)}
.empty{color:var(--mu);text-align:center;padding:18px 0;font-size:14px}
.sec{font-size:20px;font-weight:700;margin:12px 2px 10px;display:flex;align-items:center;gap:8px}
.fl-l{font-size:12px;color:var(--mu);font-weight:700;margin:8px 0 4px;letter-spacing:.5px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:3px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:transparent;border:0;color:var(--mu);font-size:13px;padding:4px 2px;border-radius:0;font-weight:400}
nav button.on{color:var(--tx);font-weight:700}
nav button b{display:flex;justify-content:center;align-items:center;margin:0 auto 2px;width:48px;height:32px;border-radius:999px;border:0}
nav button.on b{background:var(--gold);border:3px solid var(--bd)}
nav button b svg{width:22px;height:22px}
.tlh{font-weight:700;color:var(--mu);margin:4px 2px 14px}
.tr{display:flex;gap:10px;margin-bottom:14px}
.tt{flex:0 0 52px;display:flex;flex-direction:column;align-items:center;font-weight:700;position:relative}
.tt span{font-size:15px}
.tt .dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--bd);background:var(--gold);margin-top:8px;z-index:1}
.tt::after{content:"";position:absolute;top:50px;bottom:-18px;width:3px;background:var(--bd);opacity:.45}
.tr:last-child .tt::after{display:none}
.tcard{flex:1;min-width:0;background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:14px}
.ttl{font-size:17px;font-weight:700;word-break:break-word}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}
.ab{flex:0 0 auto;min-width:92px;text-align:center;font-size:14px;font-weight:700;padding:6px 12px;border:3px solid var(--bd);border-radius:999px;background:var(--card);color:var(--tx);text-decoration:none;display:inline-block}
.ab.dg{background:var(--ac)}
.done .grow{text-decoration:line-through;color:var(--mu)}
.seg{border:2px dashed var(--bd);border-radius:18px;padding:12px;margin:10px 0;background:var(--card)}
.tops{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px}
.tc{flex:0 0 auto;min-width:84px;background:var(--card);border:3px solid var(--bd);border-radius:20px;padding:8px 14px;text-align:center;font-weight:700}
.tc.on{background:var(--gold)}
.tc.add{background:transparent;border-style:dashed}
.addbar{position:sticky;bottom:92px;z-index:4;background:var(--bg);box-shadow:0 -10px 0 var(--bg);max-height:60vh;overflow-y:auto;margin-top:12px}
a:not(.ab){background:var(--green)!important;border:2px solid var(--bd);border-radius:999px;padding:2px 10px;color:var(--tx)!important;text-decoration:none;display:inline-block;font-weight:700}
li a:not(.ab){background:transparent!important;border:0!important;padding:0!important;display:inline!important;color:var(--tx)!important;text-decoration:underline!important;word-break:break-all}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
.hero{min-height:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;gap:2px;border-bottom-width:2px}
.hero>svg.deco{width:112px;height:33px;right:10px;bottom:6px}
.hero input#title{font-size:26px;line-height:1.25;max-width:62%;flex:none}
.hero textarea#sub{font-size:16px;line-height:1.4;field-sizing:content;min-height:0;overflow:hidden}
.cover{top:calc(env(safe-area-inset-top,0px) + 8px);padding:2px 10px;font-size:12px;border-width:2px}
.card.wx{padding:4px 12px;margin-bottom:8px;border-radius:16px;border-width:2px;gap:8px}
.wx .ic{font-size:20px;line-height:1}
.wx a{font-size:13px!important;padding:0 10px!important}
.sheet{padding:10px 12px 0}
.days{padding:2px 2px 8px;gap:8px}
img{max-width:100%;height:auto}
@media (max-width:480px){body{font-size:15px}.card{padding:12px;border-radius:20px}.tcard{padding:12px;border-radius:20px}.tt{flex:0 0 46px}}
</style>
</head>
